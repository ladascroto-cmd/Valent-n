<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Valentýnské přání 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .container {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      color: #e63946;
      margin-bottom: 30px;
    }

    .buttons {
      position: relative;
      height: 100px;
      margin-top: 20px;
    }

    button {
      padding: 14px 30px;
      font-size: 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      margin-right: 80px; /* větší mezera */
    }

    #yesBtn:hover {
      background: #e63946;
    }

    #noBtn {
      background: #adb5bd;
      color: #333;
      position: absolute;
      left: 260px; /* větší vzdálenost */
      top: 0;
    }

    #message {
      margin-top: 25px;
      font-size: 20px;
      color: #ff4d6d;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Budeš můj Valentýn? 💕</h1>

    <div class="buttons" id="buttons">
      <button id="yesBtn">ANO</button>
      <button id="noBtn">NE</button>
    </div>

    <div id="message">💖 Yay! Udělala/a jsi mě nejšťastnějším člověkem! 💖</div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");
    const buttons = document.getElementById("buttons");

    // Pohyb tlačítka NE
    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("touchstart", moveButton);

    function moveButton() {
      const container = document.querySelector(".buttons");

      const maxX = container.clientWidth - noBtn.offsetWidth;
      const maxY = container.clientHeight - noBtn.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // Klik na ANO
    yesBtn.addEventListener("click", () => {
      buttons.style.display = "none"; // schovat tlačítka
      message.style.display = "block";
    });

    // Kdyby se náhodou kliklo na NE
    noBtn.addEventListener("click", () => {
      buttons.style.display = "none";
      message.style.display = "block";
    });
  </script>

</body>
</html>
